server:
  enabled: true
  cors: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: sartor-api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: sartor-api-tls
        hosts:
          - sartor-api.example.com
ui:
  enabled: true
  apiKeySecret:
    name: sartor-ui-api-key
  ingress:
    enabled: true
    className: nginx
argocd:
  enabled: true
