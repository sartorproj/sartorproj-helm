# Default values for sartor.
# The defaults are a recommend-only (dry-run) install: the controller analyses
# workloads and records recommendations, but never patches workloads and never
# touches git. Opt in to each write path explicitly.

# -- Override the chart name
nameOverride: ""
# -- Override the full release name used for resource names
fullnameOverride: ""
# -- Deploy into this namespace instead of the release namespace
namespaceOverride: ""
# -- Cluster DNS domain, used to build fully qualified Service names
clusterDomain: cluster.local

global:
  # -- Image pull secrets for all components
  imagePullSecrets: []

crds:
  # -- Render the Sartor CRDs (Atelier, FitProfile, Tailoring) from files/crds
  install: true
  # -- Annotate CRDs with helm.sh/resource-policy=keep so uninstall does not delete them (and every Sartor CR with them)
  keep: true

rbac:
  # -- Create ClusterRoles, Roles and bindings
  create: true

controller:
  # -- Deploy the controller
  enabled: true
  # -- Number of replicas. Only the leader reconciles; extra replicas are hot standbys.
  replicaCount: 1

  image:
    # -- Controller image repository
    repository: ghcr.io/sartorproj/sartor
    # -- Image tag (defaults to the chart appVersion)
    tag: ""
    # -- Image digest (sha256:...). When set it pins the image; the tag is kept for readability.
    digest: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Interval between analyses of a Tailoring (--analysis-interval). Go duration, e.g. 6h, 90m.
  analysisInterval: 6h

  oomPatching:
    # -- Let the controller bump memory limits of OOM-killed containers (--enable-oom-patching).
    # Also grants pods read and deployments/statefulsets/daemonsets update/patch cluster-wide.
    enabled: false

  gitWriteback:
    # -- Let the controller open GitOps pull requests (--enable-git-writeback).
    # Needs no extra cluster RBAC: writes go to the git provider, credentials come from the Atelier secret.
    enabled: false

  leaderElection:
    # -- Enable leader election (--leader-elect). Required when replicaCount > 1.
    enabled: true

  metrics:
    # -- Serve controller metrics (--metrics-bind-address). When false the metrics server is disabled.
    enabled: true
    # -- Metrics port
    port: 8443
    # -- Serve metrics over HTTPS with Kubernetes authn/authz (--metrics-secure).
    # Scrapers then need a bearer token bound to the metrics-reader ClusterRole (see readerSubjects).
    secure: true
    # -- Subjects bound to the <fullname>-metrics-reader ClusterRole, e.g. your Prometheus service account.
    # Each item is a ServiceAccount: {name: my-prometheus, namespace: my-monitoring}
    readerSubjects: []

    serviceMonitor:
      # -- Create a prometheus-operator ServiceMonitor (monitoring.coreos.com/v1)
      enabled: false
      # -- Namespace for the ServiceMonitor (defaults to the release namespace)
      namespace: ""
      # -- Extra labels, e.g. the label your Prometheus selects on
      labels: {}
      # -- Scrape interval
      interval: 30s
      # -- Scrape timeout
      scrapeTimeout: 10s
      # -- TLS config for the HTTPS endpoint. The default self-signed certificate needs insecureSkipVerify.
      tlsConfig:
        insecureSkipVerify: true

  health:
    # -- Health probe port (--health-probe-bind-address)
    port: 8081

  # -- Extra controller arguments, appended after the chart-managed ones
  extraArgs: []
  # -- Extra environment variables
  extraEnv: []

  serviceAccount:
    # -- Create the controller service account
    create: true
    # -- Service account name (defaults to <fullname>-controller)
    name: ""
    # -- Service account annotations, e.g. for workload identity
    annotations: {}

  service:
    # -- Metrics Service type
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}

argocd:
  # -- Grant read on argoproj.io Applications (and update/patch for refreshes) to the controller and server.
  # Only needed when an Atelier sets spec.argocd.enabled.
  enabled: false

server:
  # -- Deploy the REST API server (used by the UI and integrations)
  enabled: false
  # -- Number of replicas
  replicaCount: 1

  image:
    # -- Server image repository
    repository: ghcr.io/sartorproj/sartor-server
    # -- Image tag (defaults to the chart appVersion)
    tag: ""
    # -- Image digest (sha256:...)
    digest: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Name of the Secret (in the release namespace) holding API keys. Without it the API is unauthenticated.
  apiKeySecretName: sartor-api-keys
  # -- Send CORS headers (--enable-cors). Needed when the UI is served from another origin.
  cors: false

  # -- Extra server arguments
  extraArgs: []
  # -- Extra environment variables
  extraEnv: []

  serviceAccount:
    # -- Create the server service account
    create: true
    # -- Service account name (defaults to <fullname>-server)
    name: ""
    # -- Service account annotations
    annotations: {}

  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 8080

  ingress:
    # -- Expose the server through an Ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: sartor-api.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}

ui:
  # -- Deploy the web UI (github.com/sartorproj/sartor-ui). Requires server.enabled.
  enabled: false
  # -- Number of replicas
  replicaCount: 1

  image:
    # -- UI image repository
    repository: ghcr.io/sartorproj/sartor-ui
    # -- Image tag (defaults to the chart appVersion)
    tag: ""
    # -- Image digest (sha256:...)
    digest: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Upstream the UI's nginx proxies /api/ to (SARTOR_API_URL, scheme://host:port), set as a plain env value on the UI Deployment.
  # The image has no default and answers 502 without it. Defaults to this release's server Service, fully qualified:
  # http://<fullname>-server.<namespace>.svc.<clusterDomain>:<server.service.port>
  apiUrl: ""

  # -- API key the UI proxy sends to the server (SARTOR_API_KEY). Optional: without one no key is sent.
  # The proxy adds the key server-side for every visitor. Deploy the UI on a private network or behind an
  # authenticating proxy; the server-side key proxy gives the API to anyone who can reach the UI. Never expose it publicly.
  apiKey:
    # -- Use this existing Secret in the release namespace (takes precedence over value)
    existingSecret: ""
    # -- Key within existingSecret
    existingSecretKey: api-key
    # -- Create a Secret with this key. Prefer existingSecret so the key stays out of values files.
    value: ""

  # -- Extra environment variables
  extraEnv: []

  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 5173

  ingress:
    # -- Expose the UI through an Ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress hosts
    hosts:
      - host: sartor.local
        paths:
          - path: /
            pathType: Prefix
    # -- Ingress TLS
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Pod security context. The UI image is nginx-unprivileged (UID 101) and works under any non-root UID;
  # /tmp is an emptyDir so the root filesystem can stay read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod labels
  podLabels: {}
