{{- if .Values.server.enabled }}
{{- $s := .Values.server }}
{{- if $s.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sartor.server.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
  {{- with $s.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sartor.server.fullname" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.sartorproj.io"]
    resources: ["ateliers", "fitprofiles", "tailorings"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.argocd.enabled }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sartor.server.fullname" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sartor.server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sartor.server.serviceAccountName" . }}
    namespace: {{ include "sartor.namespace" . }}
---
# API keys and Atelier credentials, release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sartor.server.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sartor.server.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sartor.server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sartor.server.serviceAccountName" . }}
    namespace: {{ include "sartor.namespace" . }}
{{- end }}
{{- end }}
