{{- if .Values.rbac.create }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sartor.controller.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sartor.server.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sartor.fullname" . }}-controller
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - autoscaling.sartorproj.io
  resources:
  - "*"
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - pods
  - pods/status
  - secrets
  - configmaps
  - resourcequotas
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.k8s.io
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sartor.fullname" . }}-controller
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sartor.fullname" . }}-controller
subjects:
- kind: ServiceAccount
  name: {{ include "sartor.controller.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sartor.fullname" . }}-server
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
rules:
- apiGroups:
  - autoscaling.sartorproj.io
  resources:
  - "*"
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sartor.fullname" . }}-server
  labels:
    {{- include "sartor.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sartor.fullname" . }}-server
subjects:
- kind: ServiceAccount
  name: {{ include "sartor.server.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
{{- end }}
