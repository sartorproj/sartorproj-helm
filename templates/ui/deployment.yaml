{{- if .Values.ui.enabled }}
{{- $u := .Values.ui }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sartor.ui.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ $u.replicaCount }}
  selector:
    matchLabels:
      {{- include "sartor.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $u.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sartor.ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- with $u.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $u.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $u.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "sartor.image" (dict "image" $u.image "ctx" $) | quote }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          {{- with $u.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          {{- with $u.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $u.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
