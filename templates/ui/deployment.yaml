{{- if .Values.ui.enabled }}
{{- $u := .Values.ui }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sartor.ui.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ $u.replicaCount }}
  selector:
    matchLabels:
      {{- include "sartor.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $u.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sartor.ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- with $u.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $u.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $u.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "sartor.image" (dict "image" $u.image "ctx" $) | quote }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          {{- $apiUrl := $u.apiUrl | default (printf "http://%s:%d" (include "sartor.server.fullname" .) (int .Values.server.service.port)) }}
          {{- if or (ne $apiUrl "http://sartor-server:8080") $u.apiKeySecret.name $u.extraEnv }}
          env:
            {{- if ne $apiUrl "http://sartor-server:8080" }}
            - name: SARTOR_API_URL
              value: {{ $apiUrl | quote }}
            {{- end }}
            {{- with $u.apiKeySecret.name }}
            - name: SARTOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $u.apiKeySecret.key }}
            {{- end }}
            {{- with $u.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          {{- with $u.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $u.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with $u.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
