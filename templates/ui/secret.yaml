{{- if and .Values.ui.enabled .Values.ui.apiKey.value (not .Values.ui.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sartor.ui.apiKeySecretName" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.ui.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.ui.apiKey.value | b64enc | quote }}
{{- end }}
