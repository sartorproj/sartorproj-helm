{{- if and .Values.controller.enabled .Values.controller.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sartor.controller.fullname" . }}-metrics
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controller.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.controller.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "sartor.controller.selectorLabels" . | nindent 4 }}
{{- end }}
