{{- if .Values.controller.enabled }}
{{- $c := .Values.controller }}
{{- if $c.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sartor.controller.serviceAccountName" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sartor.controller.fullname" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.sartorproj.io"]
    resources: ["ateliers", "fitprofiles", "tailorings"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["autoscaling.sartorproj.io"]
    resources: ["ateliers/status", "fitprofiles/status", "tailorings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["autoscaling.sartorproj.io"]
    resources: ["ateliers/finalizers", "fitprofiles/finalizers", "tailorings/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
  {{- if $c.oomPatching.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["update", "patch"]
  {{- end }}
  {{- if .Values.argocd.enabled }}
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  {{- end }}
  {{- if and $c.metrics.enabled $c.metrics.secure }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sartor.controller.fullname" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sartor.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sartor.controller.serviceAccountName" . }}
    namespace: {{ include "sartor.namespace" . }}
---
# Namespaced permissions: Secrets (Atelier credentials), leader election and events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sartor.controller.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- if $c.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sartor.controller.fullname" . }}
  namespace: {{ include "sartor.namespace" . }}
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sartor.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sartor.controller.serviceAccountName" . }}
    namespace: {{ include "sartor.namespace" . }}
{{- if and $c.metrics.enabled $c.metrics.secure }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sartor.fullname" . }}-metrics-reader
  labels:
    {{- include "sartor.controller.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- with $c.metrics.readerSubjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sartor.fullname" $ }}-metrics-reader
  labels:
    {{- include "sartor.controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sartor.fullname" $ }}-metrics-reader
subjects:
  {{- range . }}
  - kind: ServiceAccount
    name: {{ required "controller.metrics.readerSubjects[].name is required" .name }}
    namespace: {{ required "controller.metrics.readerSubjects[].namespace is required" .namespace }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
