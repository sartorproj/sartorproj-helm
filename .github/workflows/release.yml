name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" Chart.yaml

      - name: Package Helm chart
        run: |
          mkdir -p .helm-releases
          helm package . -d .helm-releases/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: .helm-releases/*.tgz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Update Helm Repository Index
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release artifact
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: sartor-${{ steps.version.outputs.version }}.tgz
          path: ./

      - name: Fetch packaged chart from release
        run: |
          curl -L -o sartor-${{ steps.version.outputs.version }}.tgz \
            "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/sartor-${{ steps.version.outputs.version }}.tgz" || true

      - name: Update Helm repository index
        run: |
          if [ -f index.yaml ]; then
            helm repo index . --merge index.yaml --url https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/
          else
            helm repo index . --url https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/
          fi

      - name: Commit and push
        run: |
          git add index.yaml
          git commit -m "Update index.yaml for v${{ steps.version.outputs.version }}" || true
          git push origin gh-pages || true
